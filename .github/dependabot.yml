# Weekly dependency update pull requests. Dependabot only opens PRs; who may
# merge one is AGENTS.md rule 1. Minor and patch bumps arrive grouped as one
# PR per ecosystem so they are cheap to review. Major bumps (TypeScript, vitest)
# arrive one PR each: each needs its own testing. Astro, its React integration
# and the PWA plugin need each other's matching majors, so their major bumps
# arrive together as one PR; it must re-check the CSP hashes and the PWA config.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The site builds and runs on Node 22 (.nvmrc, engines, every workflow).
      # Node's type definitions should not move to a newer Node major than
      # that, or the types describe APIs the runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # 2.0.2 installs without the `rolldown` package its PWA core imports, so
      # `astro build` fails (found 2026-11-14 on the grouped PR #112). Skip only
      # this version; the next release is offered again.
      - dependency-name: '@vite-pwa/astro'
        versions: ['2.0.2']
    groups:
      # Astro 7 needed @astrojs/react 7 and @vite-pwa/astro 2 in the same
      # change. Dependabot opened one PR each, and each failed CI on its own.
      astro-major:
        patterns: ['astro', '@astrojs/*', '@vite-pwa/astro']
        update-types: [major]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
