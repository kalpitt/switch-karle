# Weekly dependency update pull requests. Dependabot only opens PRs; nothing
# merges or deploys without Kalpit. Minor and patch bumps arrive grouped as one
# PR per ecosystem so they are cheap to review. Major bumps (Astro, the PWA
# plugin, TypeScript, vitest) arrive one PR each: each needs its own testing,
# and the Astro major in particular must re-check the CSP hashes and the PWA config.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @vite-pwa/astro 2 is a rewrite on Rolldown/Vite 8. Tried 2026-11-07 on
      # Vite 6: it needs an extra `rolldown` install, and its service worker
      # silently drops every includeAssets file (icons.svg, favicons, app icons)
      # from the offline cache. Revisit when the site itself moves to Vite 8.
      - dependency-name: '@vite-pwa/astro'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
