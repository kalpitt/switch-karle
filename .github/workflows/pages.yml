# Deploys. The checks below duplicate ci.yml on purpose — ci.yml gates the PR,
# this gates production. Keep the two step lists in sync.
name: Deploy to GitHub Pages (kalpit.me/switch-karle)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Guards the path-relative build so the subpath deploy cannot break
      # silently. Retire with `base: './'` when the custom domain lands.
      - run: npm run check:relative-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
