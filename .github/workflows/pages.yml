# Deploys. The checks below duplicate ci.yml on purpose — ci.yml gates the PR,
# this gates production. Keep the two step lists in sync.
name: Deploy to GitHub Pages (kalpit.me/switch-karle)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Guards that asset URLs resolve under the configured base so the
      # subpath deploy cannot break silently. Cutover flips base to `/`.
      - run: npm run check:base
      - run: npm run check:seo
      - run: npm run check:csp
      - name: No private machine paths in tracked files
        # Mirrors ci.yml. That one gates the pull request, this one gates
        # production — and a merge whose CI ran before a later push would
        # otherwise deploy a leaked path with nothing to stop it.
        run: |
          if git grep -nE '(^|[[:space:]"'"'"'`(=])/(Users|home)/[A-Za-z0-9._-]+/' \
               -- . ':(exclude).github/workflows/ci.yml' ':(exclude).github/workflows/pages.yml'; then
            echo "::error::Private machine path in a tracked file. Remove it."
            exit 1
          fi
          echo "No private machine paths found."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
