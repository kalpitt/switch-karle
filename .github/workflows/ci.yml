# Gates pull requests. pages.yml runs the same checks again before deploying,
# which is deliberate: this one stops a bad PR from being merged, that one stops
# a bad merge from reaching production. Keep the two step lists in sync.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:base
      - run: npm run check:seo
      - run: npm run check:csp
      - name: No private machine paths in tracked files
        # This repo is public. A home-directory path discloses the macOS
        # username, the machine layout, and the names of private repos.
        # AGENTS.md carried one for months before an audit caught it on
        # 2026-08-29. Voice has the same gate in its publish script; this
        # repo had nothing.
        run: |
          if git grep -nE '(^|[[:space:]"'"'"'`(=])/(Users|home)/[A-Za-z0-9._-]+/' \
               -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Private machine path in a tracked file. Remove it."
            exit 1
          fi
          echo "No private machine paths found."
